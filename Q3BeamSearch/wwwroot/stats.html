<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 Run Statistics</title>
    <link rel="stylesheet" href="css/stats.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script type="module" src="js/stats.js"></script>
</head>
<body>
    <header class="topbar">
        <h1>Q3 Run Statistics</h1>
        <div class="run-controls">
            <select id="demoList" title="Saved runs (wwwroot/demos)">
                <option value="">Saved runs…</option>
            </select>
            <button id="btnRefresh" title="Reload the list of saved runs">⟳</button>
            <button id="btnViewerRun" title="The run last sent from the 3D viewer's 📊 Stats button">Viewer run</button>
            <label title="The physics the run was made with: the analysis replays each frame with it. CPM = df_promode 1.">
                Physics
                <select id="physics">
                    <option value="vq3">VQ3</option>
                    <option value="cpm">CPM</option>
                </select>
            </label>
            <button id="btn3DView" class="primary" title="Open this run in the 3D viewer" disabled>🎮 3D View</button>
            <button id="btnExportJSON" title="Download the run's frames" disabled>📥 Export JSON</button>
        </div>
        <span id="status" class="status">Ready</span>
    </header>

    <section id="playbar" class="playbar" hidden>
        <div class="transport">
            <button id="btnFirst" title="First frame (Home)">⏮</button>
            <button id="btnPrev" title="Previous frame (←)">⏴</button>
            <button id="btnPlay" title="Play / pause (Space)">▶</button>
            <button id="btnNext" title="Next frame (→)">⏵</button>
            <button id="btnLast" title="Last frame (End)">⏭</button>
        </div>
        <input type="range" id="frameSlider" min="0" max="0" value="0" step="1" aria-label="Frame">
        <span id="frameDisplay" class="frame-display">0 / 0</span>
        <select id="playbackSpeed" title="Playback speed (125 frames per second at 1x)">
            <option value="0.1">0.1x</option>
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
        </select>
        <div class="keys" title="Keys held this frame">
            <span id="keyW" class="key">W</span>
            <span id="keyA" class="key">A</span>
            <span id="keyS" class="key">S</span>
            <span id="keyD" class="key">D</span>
            <span id="keyJump" class="key">JUMP</span>
        </div>
    </section>

    <p id="empty" class="empty">Pick a saved run above, or press 📊 Stats in the 3D viewer to send its run here.</p>

    <main id="dashboard" hidden>
        <section id="summary" class="tiles"></section>

        <section class="frame-panel">
            <div class="panel">
                <h2>Current frame</h2>
                <dl id="frameDetails" class="details"></dl>
            </div>
            <div class="panel compass-panel">
                <h2>Directions (Q3 yaw)</h2>
                <canvas id="compass"></canvas>
                <ul class="legend">
                    <li><i class="view"></i>View</li>
                    <li><i class="vel"></i>Velocity</li>
                    <li><i class="wish"></i>Wish</li>
                </ul>
            </div>
        </section>

        <section class="charts">
            <figure class="panel">
                <h2>Speed</h2>
                <p class="hint">Horizontal speed (ups). Click any chart to go to that frame.</p>
                <div class="chart-box"><canvas id="speedChart"></canvas></div>
            </figure>
            <figure class="panel">
                <h2>Path</h2>
                <p class="hint">Top down, Q3 x and y at the same scale.</p>
                <div class="chart-box"><canvas id="pathChart"></canvas></div>
            </figure>
            <figure class="panel">
                <h2>Strafe angle</h2>
                <p class="hint">Angle between the wish direction and the velocity. Without snapping, the most acceleration is at the CGaz best angle and none below the no-accel angle. Snapping can make a yaw far from it faster: the efficiency chart rates each frame with snapping.</p>
                <div class="chart-box"><canvas id="angleChart"></canvas></div>
            </figure>
            <figure class="panel">
                <h2>Strafe efficiency</h2>
                <p class="hint">Speed gained ÷ the most the best yaw could gain with the same keys (one-frame Pmove, snapping included). <span id="effNote"></span></p>
                <div class="chart-box"><canvas id="effChart"></canvas></div>
            </figure>
            <figure class="panel">
                <h2>Velocity</h2>
                <p class="hint">The velocity vector (vx, vy) every frame. Rays: this frame's velocity and view yaw.</p>
                <div class="chart-box"><canvas id="velocityChart"></canvas></div>
            </figure>
        </section>
    </main>
</body>
</html>
